<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
  <h2 style="color: #e94560;">バグ運賃アラート！</h2>
  <p>異常に安い運賃を発見しました。エラー運賃の可能性があります。お早めに！</p>
  <div style="background: #f8f8f8; padding: 16px; border-radius: 8px; margin: 16px 0;">
    <p><strong>路線：</strong> {{ origin }} → {{ destination }}</p>
    <p><strong>航空会社：</strong> {{ airline }}</p>
    <p><strong>日付：</strong> {{ departure_date }}</p>
    <p style="font-size: 24px; color: #e94560;"><strong>{{ price_amount }} {{ price_currency }}</strong></p>
    <p style="color: #666;">平均価格: {{ avg_price }} {{ price_currency }}（{{ discount_pct }}%オフ）</p>
    <p><strong>信頼度：</strong> {{ confidence }}</p>
  </div>
  <p style="color: #666; font-size: 12px;">
    <a href="{{ unsubscribe_url }}">バグ運賃アラートの配信停止</a>
  </p>
</body>
</html>
