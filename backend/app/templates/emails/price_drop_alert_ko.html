<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
  <h2 style="color: #0f3460;">가격 인하 알림</h2>
  <p>관심 노선의 가격이 인하되었습니다!</p>
  <div style="background: #f8f8f8; padding: 16px; border-radius: 8px; margin: 16px 0;">
    <p><strong>노선:</strong> {{ origin }} → {{ destination }}</p>
    <p><strong>날짜:</strong> {{ departure_date }}</p>
    <p><strong>이전 가격:</strong> <s>{{ previous_price }} {{ price_currency }}</s></p>
    <p style="font-size: 24px; color: #16c79a;"><strong>현재: {{ current_price }} {{ price_currency }}</strong></p>
    <p>목표 가격: {{ target_price }} {{ price_currency }}</p>
  </div>
  <p style="color: #666; font-size: 12px;">
    <a href="{{ unsubscribe_url }}">가격 인하 알림 수신 거부</a>
  </p>
</body>
</html>
