<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
  <h2 style="color: #0f3460;">降价通知</h2>
  <p>您关注的航线刚刚降价了！</p>
  <div style="background: #f8f8f8; padding: 16px; border-radius: 8px; margin: 16px 0;">
    <p><strong>航线：</strong> {{ origin }} → {{ destination }}</p>
    <p><strong>日期：</strong> {{ departure_date }}</p>
    <p><strong>原价：</strong> <s>{{ previous_price }} {{ price_currency }}</s></p>
    <p style="font-size: 24px; color: #16c79a;"><strong>现在：{{ current_price }} {{ price_currency }}</strong></p>
    <p>您的目标价格：{{ target_price }} {{ price_currency }}</p>
  </div>
  <p style="color: #666; font-size: 12px;">
    <a href="{{ unsubscribe_url }}">取消订阅</a>降价通知
  </p>
</body>
</html>
